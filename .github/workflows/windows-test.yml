name: Windows test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run isolated registry tests
        shell: cmd
        run: call Claude-Policy-Tool.cmd --self-test

      - name: Run isolated regression tests
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\test-regressions.ps1

      - name: Run isolated local configuration tests
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\test-local-config.ps1

      - name: Check restore format and manifest boundaries
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\test-restore-boundaries.ps1 -ResultPath "%RUNNER_TEMP%\claude-restore-tests.json"

      - name: Check backup paths and content snapshots
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\test-backup-paths.ps1 -ResultPath "%RUNNER_TEMP%\claude-path-tests.json"

      - name: Check runtime edge cases
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\test-runtime-edges.ps1 -ResultPath "%RUNNER_TEMP%\claude-runtime-tests.json"

      - name: Check release output boundaries
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\test-build-boundaries.ps1 -ResultPath "%RUNNER_TEMP%\claude-build-tests.json"

      - name: Build release package
        shell: powershell
        run: .\tools\build-release.ps1

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: claude-desktop-policy-tool
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
